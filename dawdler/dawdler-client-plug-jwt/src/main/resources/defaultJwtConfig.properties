# jwt默认配置,当classpath下不存在jwt.properties且未接入统一配置中心时使用

# 签名算法,支持 HS256 HS384 HS512 RS256 RS384 RS512
algorithm=HS256
# HMAC密钥(HS*算法使用),生产环境务必修改
secret=dawdler-default-jwt-secret
# RSA私钥(RS*算法签发时使用),支持base64(DER)或PEM格式,留空则不启用
rsaPrivateKey=
# RSA公钥(RS*算法验签时使用),支持base64(DER)或PEM格式,留空则不启用
rsaPublicKey=

# token获取方式,可选 header cookie param,可组合用逗号分隔
tokenFrom=header
# header方式时的请求头名称
headerName=Authorization
# header值的前缀,如Bearer (含尾部空格),为空则取整个header值
headerPrefix=Bearer 
# cookie方式时的cookie名称
cookieName=token
# param方式时的参数名称
paramName=token

# 签发者,校验时要求token的iss与之匹配,为空则不校验
issuer=
# 受众,校验时要求token的aud包含此项,为空则不校验
audience=
# token过期时间(秒),签发时未显式设置exp时使用
expireSeconds=7200
# 允许的时钟偏移(秒),用于exp/nbf校验
leewaySeconds=0

# token无效或缺失时是否拦截请求(返回401),false则仅解析填充上下文不拦截
rejectOnInvalid=true
# 无需校验的uri白名单,逗号分隔,支持antPath,如 /login,/public/**
excludePaths=
# 拦截时返回的http状态码
unauthorizedStatus=401
# 拦截时返回的响应体
unauthorizedBody={"code":401,"msg":"unauthorized"}
